name: Release CI

on:
  workflow_dispatch:
  push:
    tags:
      - "*-v*.*.*"

permissions:
  contents: read

jobs:
  resolve-package-path:
    runs-on: ubuntu-latest
    outputs:
      package-path: ${{ steps.extract.outputs.package-path }}
    steps:
      - name: Resolve package path from tag
        id: extract
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          COMPONENT="${TAG%-v*}"
          echo "package-path=packages/${COMPONENT}" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-package-path
    uses: camarojs/workflows/.github/workflows/build-nodejs.yml@v1
    with:
      upload-artifact: true
      path-to-artifact: |
        ${{ needs.resolve-package-path.outputs.package-path }}/**
        package.json
        package-lock.json

  publish-to-npm:
    needs: 
      - build
      - resolve-package-path
    uses: camarojs/workflows/.github/workflows/npm-publish.yml@v1
    permissions:
      id-token: write
    with:
      package-path: ${{ needs.resolve-package-path.outputs.package-path }}
