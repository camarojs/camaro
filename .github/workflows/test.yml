name: Test CI

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - '*'
      - '!main'
    pull_request:
      branches:
      - 'main'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.0
      - uses: actions/setup-node@v4.0.4
        with:
          node-version: 'latest'
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      
